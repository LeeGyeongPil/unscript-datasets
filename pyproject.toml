[project]
name = "unscript-datasets"
version = "0.1.1"
description = "Scan Python code and notebooks for load_dataset calls broken by 'Dataset scripts are no longer supported' and rewrite them based on each Hub dataset's current state."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "LeeGyeongPil" }]
keywords = ["huggingface", "datasets", "migration", "parquet", "codemod"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["huggingface_hub>=2.4.0,<3"]

[project.urls]
Homepage = "https://github.com/LeeGyeongPil/unscript-datasets"
Issues = "https://github.com/LeeGyeongPil/unscript-datasets/issues"

[project.scripts]
unscript-datasets = "unscript_datasets.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unscript_datasets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
